[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-analyzer"
version = "0.1.0"
description = "Mehrpositions-Analyzer fuer REW-Messungen (KEF LS50 Wireless + Saxx DS 120 DSP, Wohnzimmer-Kontext)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Klaus-ctrl-prog" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
include = ["spatial_analyzer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
